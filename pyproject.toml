[tool.poetry]
name = "workflow-automate"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [
    { include = "api", from = "src" },
    { include = "engine", from = "src" },
    { include = "shared", from = "src" },
    { include = "worker", from = "src" },
]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "*"
uvicorn = "*"
gunicorn = "*"
psycopg2-binary = "*"
structlog = "*"
httpx = "*"
prometheus-client = "*"

[tool.poetry.group.dev.dependencies]
pytest = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
