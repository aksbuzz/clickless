# Celery 5.5 / kombu 5.5 declare transient, non-exclusive queues for worker remote control (pidbox).
# RabbitMQ 4 rejects those by default ("Feature transient_nonexcl_queues is deprecated"), which makes
# every Celery worker restart in a loop and makes Celery's inspect() fail.
#
# This setting is a stopgap: RabbitMQ will remove the feature in a future major version, regardless of
# configuration. Remove this file when Celery is replaced (see docs/adr/0017) or when Celery stops
# using such queues.
deprecated_features.permit.transient_nonexcl_queues = true
