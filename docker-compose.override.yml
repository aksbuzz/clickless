# Development additions, loaded automatically by `docker compose up`. CI and production-style runs
# use only docker-compose.yml (`docker compose -f docker-compose.yml up`).
services:
  api:
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./src:/app/src
    environment:
      LOG_LEVEL: debug

  engine:
    command: celery -A src.shared.celery_app.app worker --loglevel=debug -Q orchestration_queue -n engine@%h
    volumes:
      - ./src:/app/src

  worker:
    command: celery -A src.shared.celery_app.app worker --loglevel=debug -Q actions_queue -n worker@%h
    volumes:
      - ./src:/app/src
    deploy:
      replicas: 1

  relay:
    command: python src/relay/entrypoint/main.py
    volumes:
      - ./src:/app/src

  # RabbitMQ management UI, on this machine only.
  rabbitmq:
    ports:
      - "127.0.0.1:15672:15672"

  # Database browser, off by default: docker compose --profile dev-tools up
  adminer:
    image: adminer:latest
    profiles: ["dev-tools"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - app-network
