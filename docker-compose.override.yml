# Development additions, loaded automatically by `docker compose up`. CI and production-style runs
# use only docker-compose.yml (`docker compose -f docker-compose.yml up`).
services:
  api:
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./src:/app/src
    environment:
      LOG_LEVEL: debug

  # The worker does not reload by itself: after editing code, run `docker compose restart worker`.
  worker:
    volumes:
      - ./src:/app/src

  # Database browser, off by default: docker compose --profile dev-tools up
  adminer:
    image: adminer:latest
    profiles: ["dev-tools"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - app-network
