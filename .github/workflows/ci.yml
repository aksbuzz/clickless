name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies from poetry.lock
        run: |
          pip install poetry
          poetry config virtualenvs.create false
          poetry install --no-root --no-interaction
      - name: Unit tests
        run: python -m pytest -q tests

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test   # node's built-in runner; needs Node 22.18+ to run TypeScript directly
      - run: npm run build

  smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack (base compose file only, no dev override)
        run: |
          sh scripts/init-env.sh
          docker compose -f docker-compose.yml up -d --build
      - name: Run the seeded workflow down both branches
        run: sh scripts/smoke.sh
      - name: Show container logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml down -v
