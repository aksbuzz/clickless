services:
  # The queue, the state and the workflow definitions all live here. Not published to the host.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?run scripts/init-env.sh to create .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/init-env.sh to create .env}
      POSTGRES_DB: ${POSTGRES_DB:?run scripts/init-env.sh to create .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  api:
    build: .
    env_file: .env
    command: gunicorn -k uvicorn.workers.UvicornWorker src.api.main:app --bind 0.0.0.0:8000 --workers 4 --timeout 60
    environment:
      API_KEY: ${API_KEY:?run scripts/init-env.sh to create .env}
      SECRETS_KEY: ${SECRETS_KEY:?run scripts/init-env.sh to create .env, or sh scripts/init-env.sh --upgrade to add the key to an existing one}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      TRELLO_API_SECRET: ${TRELLO_API_SECRET:-}
      TRELLO_CALLBACK_URL: ${TRELLO_CALLBACK_URL:-}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  # Claims jobs from Postgres and runs workflow steps. Scale with: docker compose up -d --scale worker=3
  # Its Prometheus metrics are on port 9100 inside the compose network.
  worker:
    build: .
    env_file: .env
    command: python -m src.worker.main
    stop_grace_period: 45s
    environment:
      SECRETS_KEY: ${SECRETS_KEY:?run scripts/init-env.sh to create .env, or sh scripts/init-env.sh --upgrade to add the key to an existing one}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9100/metrics', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build: ./frontend
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
